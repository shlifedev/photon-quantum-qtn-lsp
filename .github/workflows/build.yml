name: Build

# CI와 Release가 공유하는 빌드 파이프라인.
# version 입력이 비어 있으면 dev 빌드(버전 주입 없음), 값이 있으면 각 아티팩트에 주입한다.
on:
  workflow_call:
    inputs:
      version:
        description: '아티팩트에 주입할 릴리스 버전 (예: v1.2.3). 비우면 dev 빌드.'
        type: string
        required: false
        default: ''
    # JetBrains 서명/마켓 배포 + VSCode 마켓 배포용. dev·PR 빌드에서는 비어 있어도 동작하므로 모두 optional.
    secrets:
      JETBRAINS_CERTIFICATE_CHAIN:
        required: false
      JETBRAINS_PRIVATE_KEY:
        required: false
      JETBRAINS_PRIVATE_KEY_PASSWORD:
        required: false
      JETBRAINS_PUBLISH_TOKEN:
        required: false
      VSCE_PAT:
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/language-server/package-lock.json
            packages/vscode-extension/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/language-server ci
          npm --prefix packages/vscode-extension ci

      - name: Sync grammar
        run: node scripts/sync-grammar.mjs

      - name: Runtime packaging tests
        run: npm run test:runtimes

      - name: Language Server unit tests
        run: npm --prefix packages/language-server test

      - name: Language Server protocol integration test
        # Spawns the real compiled server.js and drives it over the LSP wire —
        # the exact contract VSCode, Visual Studio, and Rider all invoke.
        run: npm --prefix packages/language-server run test:integration

      - name: Grammar tests
        run: npm --prefix packages/vscode-extension test

      - name: Grammar snapshot test
        run: npm --prefix packages/vscode-extension run test:snap

  build-vscode:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 게시 스텝의 if에서 시크릿 존재 여부를 보려면 job 레벨 env가 필요하다(step env는 같은 step if에서 못 읽음).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/language-server/package-lock.json
            packages/vscode-extension/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix packages/language-server ci
          npm --prefix packages/vscode-extension ci

      - name: Sync grammar
        run: node scripts/sync-grammar.mjs

      - name: Inject version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: npm --prefix packages/vscode-extension version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        working-directory: packages/vscode-extension
        run: npx vsce package --no-dependencies

      - name: Prepare artifact
        run: |
          mkdir -p release
          cp packages/vscode-extension/*.vsix release/QtnLSP-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: release/QtnLSP-vscode.vsix
          retention-days: 7

      # 버전 릴리스이고 VSCE_PAT가 설정돼 있으면 마켓플레이스에 게시. PAT 미설정 시 자동 스킵해
      # 릴리스 파이프라인이 깨지지 않게 한다. --skip-duplicate로 같은 버전 재실행도 안전.
      - name: Publish to VSCode Marketplace
        if: inputs.version != '' && env.VSCE_PAT != ''
        working-directory: packages/vscode-extension
        run: npx vsce publish --packagePath ../../release/QtnLSP-vscode.vsix --skip-duplicate

  build-jetbrains:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/language-server/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 공유 서버 번들과 플랫폼별 Node 실행 파일을 동봉한다.
      - name: Build language-server bundle
        run: |
          npm ci
          npm --prefix packages/language-server ci
          npm run bundle:server
          npm run prepare:runtimes -- --target=jetbrains

      - name: Sync grammar
        run: node scripts/sync-grammar.mjs

      - name: Rider launcher tests
        working-directory: packages/jetbrains-plugin
        run: ./gradlew test

      # 릴리스(version 있음)면 서명본을 만들고, PR/dev면 서명 없이 빌드만 검증한다.
      # 시크릿은 base64로 저장돼 있어 파일로 디코드 후 경로를 주입한다(멀티라인 전달 손상 회피).
      - name: Build / sign JetBrains plugin
        working-directory: packages/jetbrains-plugin
        env:
          VERSION: ${{ inputs.version }}
          CERTIFICATE_CHAIN_B64: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY_B64: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$VERSION" ]; then
            printf '%s' "$CERTIFICATE_CHAIN_B64" | base64 -d > sign-chain.crt
            printf '%s' "$PRIVATE_KEY_B64" | base64 -d > sign-private.pem
            keytool -printcert -file sign-chain.crt >/dev/null \
              || { echo "::error::certificate chain failed to parse — check JETBRAINS_CERTIFICATE_CHAIN (must be base64 of chain.crt)"; exit 1; }
            export CERTIFICATE_CHAIN_FILE=sign-chain.crt PRIVATE_KEY_FILE=sign-private.pem
            ./gradlew signPlugin "-PpluginVersion=${VERSION#v}"
          else
            ./gradlew buildPlugin
          fi

      - name: Prepare artifact
        run: |
          mkdir -p release
          # signPlugin은 *-signed.zip을 추가로 만든다. 릴리스면 서명본, dev면 일반 zip을 고른다.
          signed=$(find packages/jetbrains-plugin/build/distributions -name '*-signed.zip' | head -1)
          if [ -n "$signed" ]; then
            cp "$signed" release/QtnLSP-jetbrains.zip
          else
            cp packages/jetbrains-plugin/build/distributions/*.zip release/QtnLSP-jetbrains.zip
          fi

      - name: Verify packaged Rider server
        run: npm run test:package -- jetbrains release/QtnLSP-jetbrains.zip

      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains-zip
          path: release/QtnLSP-jetbrains.zip
          retention-days: 7

  build-vs:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    # 게시 스텝 if에서 시크릿 존재 여부를 보려면 job 레벨 env가 필요(build-vscode와 동일 이유).
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/language-server/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # csproj가 language-server/dist/server.js(단일 webpack 번들)를 직접 링크한다
      - name: Build language-server bundle
        run: |
          npm ci
          npm --prefix packages/language-server ci
          npm run bundle:server
          npm run prepare:runtimes -- --target=vs

      - name: Sync grammar + LICENSE
        shell: bash
        run: |
          node scripts/sync-grammar.mjs
          cp LICENSE packages/vs-extension/LICENSE

      - name: Inject version
        if: inputs.version != ''
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ver = $env:VERSION -replace '^v', ''
          $path = 'packages/vs-extension/source.extension.vsixmanifest'
          $content = Get-Content $path -Raw
          $content = $content -replace '(<Identity\b[^>]*\bVersion=")[^"]*(")', "`${1}$ver`${2}"
          Set-Content -Path $path -Value $content -NoNewline

      - name: Build VS extension
        working-directory: packages/vs-extension
        run: dotnet build -c Release

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p release
          find packages/vs-extension/bin/Release -name "*.vsix" -exec cp {} release/QtnLSP-vs.vsix \;

      - name: Verify packaged Visual Studio server
        run: npm run test:package -- vs release/QtnLSP-vs.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vs-vsix
          path: release/QtnLSP-vs.vsix
          retention-days: 7

  verify-packages:
    needs: build-jetbrains
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win-x64
          - runner: windows-11-arm
            platform: win-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-22.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          name: jetbrains-zip
          path: release
      - name: Install test tools
        run: |
          npm ci
          npm --prefix packages/language-server ci
      - name: Exercise packaged runtime without system Node
        env:
          QTN_TEST_PLATFORM: ${{ matrix.platform }}
        run: npm run test:package -- jetbrains release/QtnLSP-jetbrains.zip

  publish-jetbrains:
    needs: verify-packages
    if: inputs.version != '' && vars.JETBRAINS_MARKETPLACE_LISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jetbrains-zip
          path: release
      # Publish the exact signed ZIP tested on all six platforms, without rebuilding.
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --header "Authorization: Bearer $PUBLISH_TOKEN" \
            -F xmlId=com.qtn.syntax-highlighting \
            -F file=@release/QtnLSP-jetbrains.zip \
            https://plugins.jetbrains.com/api/updates/upload

  publish-vs:
    needs: [build-vs, verify-packages]
    if: inputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vs-vsix
          path: release

      # 버전 릴리스이고 VSCE_PAT가 있으면 VS Marketplace에 게시. VSCE_PAT는 VSCode와 공유한다
      # (둘 다 marketplace.visualstudio.com / Azure DevOps PAT). PAT 미설정 시 자동 스킵.
      # VsixPublisher는 확장이 없으면 생성, 있으면 같은 버전도 덮어쓰므로 멱등.
      - name: Publish to VS Marketplace
        if: inputs.version != '' && env.VSCE_PAT != ''
        working-directory: packages/vs-extension
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsdir = & $vswhere -latest -property installationPath
          $publisher = Join-Path $vsdir 'VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe'
          if (-not (Test-Path $publisher)) { throw "VsixPublisher.exe not found at $publisher" }
          & $publisher publish `
            -payload "..\..\release\QtnLSP-vs.vsix" `
            -publishManifest "vs-publish.json" `
            -personalAccessToken "$env:VSCE_PAT"
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher exited with $LASTEXITCODE" }
